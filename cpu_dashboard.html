<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU 监控中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .header p { color: #888; }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .card-title {
            font-size: 1.2em;
            color: #00d4ff;
        }
        
        .card-value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .gauge {
            width: 100%;
            height: 150px;
            position: relative;
        }
        
        .gauge-bg {
            fill: none;
            stroke: rgba(255,255,255,0.1);
            stroke-width: 10;
        }
        
        .gauge-fill {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.5s, stroke 0.5s;
        }
        
        .gauge-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .gauge-label {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 0.9em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-label {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .process-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .process-table th,
        .process-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .process-table th {
            background: rgba(0,212,255,0.1);
            color: #00d4ff;
            cursor: pointer;
            user-select: none;
        }
        
        .process-table th:hover {
            background: rgba(0,212,255,0.2);
        }
        
        .process-table tr:hover {
            background: rgba(255,255,255,0.05);
        }
        
        .cpu-bar {
            width: 100px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        .cpu-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        
        .cpu-low { background: #00ff88; }
        .cpu-medium { background: #ffaa00; }
        .cpu-high { background: #ff4444; }
        
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
        }
        
        .btn-danger {
            background: #ff4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #cc0000;
            transform: scale(1.05);
        }
        
        .btn-warning {
            background: #ffaa00;
            color: white;
        }
        
        .btn-warning:hover {
            background: #cc8800;
        }
        
        .btn-success {
            background: #00ff88;
            color: black;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1em;
        }
        
        .search-box::placeholder {
            color: #666;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-btn:hover,
        .filter-btn.active {
            background: rgba(0,212,255,0.2);
            border-color: #00d4ff;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-danger {
            background: rgba(255,68,68,0.2);
            border: 1px solid #ff4444;
        }
        
        .alert-success {
            background: rgba(0,255,136,0.2);
            border: 1px solid #00ff88;
        }
        
        .log-panel {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.85em;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .log-time {
            color: #888;
            margin-right: 10px;
        }
        
        .log-action {
            color: #00ff88;
        }
        
        .log-warning {
            color: #ffaa00;
        }
        
        .log-error {
            color: #ff4444;
        }
        
        .refresh-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            margin-left: 10px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .chart-container {
            height: 200px;
            position: relative;
        }
        
        .chart-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }
        
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>CPU 监控中心</h1>
        <p>实时系统性能监控与进程管理</p>
    </div>
    
    <div class="stats-grid">
        <div class="stat-item">
            <div class="stat-label">CPU 使用率</div>
            <div class="stat-value" id="cpuValue" style="color: #00ff88;">0%</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">内存使用</div>
            <div class="stat-value" id="memValue" style="color: #00d4ff;">0%</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">进程总数</div>
            <div class="stat-value" id="procCount" style="color: #ffaa00;">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">线程总数</div>
            <div class="stat-value" id="threadCount" style="color: #7b2cbf;">0</div>
        </div>
    </div>
    
    <div class="dashboard">
        <div class="card">
            <div class="card-header">
                <span class="card-title">CPU 使用率</span>
                <span class="refresh-indicator"></span>
            </div>
            <div class="gauge">
                <svg viewBox="0 0 200 120">
                    <path class="gauge-bg" d="M 20 100 A 80 80 0 0 1 180 100"></path>
                    <path class="gauge-fill" id="cpuGauge" d="M 20 100 A 80 80 0 0 1 180 100" 
                          stroke="#00ff88" stroke-dasharray="251" stroke-dashoffset="251"></path>
                </svg>
                <div class="gauge-text" id="cpuGaugeText">0%</div>
                <div class="gauge-label">Processor</div>
            </div>
            <div class="chart-container">
                <canvas id="cpuChart"></canvas>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <span class="card-title">内存使用</span>
            </div>
            <div class="gauge">
                <svg viewBox="0 0 200 120">
                    <path class="gauge-bg" d="M 20 100 A 80 80 0 0 1 180 100"></path>
                    <path class="gauge-fill" id="memGauge" d="M 20 100 A 80 80 0 0 1 180 100" 
                          stroke="#00d4ff" stroke-dasharray="251" stroke-dashoffset="251"></path>
                </svg>
                <div class="gauge-text" id="memGaugeText">0%</div>
                <div class="gauge-label">Memory</div>
            </div>
            <div style="margin-top: 20px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span style="color: #888;">已用内存</span>
                    <span id="memUsed">0 GB</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span style="color: #888;">可用内存</span>
                    <span id="memFree">0 GB</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #888;">总内存</span>
                    <span id="memTotal">0 GB</span>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <span class="card-title">系统信息</span>
            </div>
            <div style="line-height: 2;">
                <div><strong>处理器:</strong> <span id="cpuName">-</span></div>
                <div><strong>核心/线程:</strong> <span id="cpuCores">-</span></div>
                <div><strong>运行时间:</strong> <span id="uptime">-</span></div>
                <div><strong>句柄数:</strong> <span id="handles">-</span></div>
            </div>
        </div>
    </div>
    
    <div class="card">
        <div class="card-header">
            <span class="card-title">进程管理</span>
            <div>
                <button class="btn btn-warning" onclick="optimizeSystem()">一键优化</button>
                <button class="btn btn-success" onclick="refreshData()">刷新数据</button>
            </div>
        </div>
        
        <div class="controls">
            <input type="text" class="search-box" placeholder="搜索进程..." id="searchInput" onkeyup="filterProcesses()">
            <button class="filter-btn active" onclick="setFilter('all')">全部</button>
            <button class="filter-btn" onclick="setFilter('high')">高CPU</button>
            <button class="filter-btn" onclick="setFilter('trae')">Trae CN</button>
            <button class="filter-btn" onclick="setFilter('system')">系统</button>
        </div>
        
        <div id="alertBox" style="display: none;"></div>
        
        <table class="process-table">
            <thead>
                <tr>
                    <th onclick="sortTable('pid')">PID ↕</th>
                    <th onclick="sortTable('name')">进程名 ↕</th>
                    <th onclick="sortTable('cpu')">CPU % ↕</th>
                    <th onclick="sortTable('memory')">内存 ↕</th>
                    <th onclick="sortTable('threads')">线程 ↕</th>
                    <th>优先级</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="processTableBody">
                <!-- 数据通过JavaScript填充 -->
            </tbody>
        </table>
    </div>
    
    <div class="card">
        <div class="card-header">
            <span class="card-title">操作日志</span>
            <button class="btn btn-danger" onclick="clearLog()">清空日志</button>
        </div>
        <div class="log-panel" id="logPanel">
            <div class="log-entry">
                <span class="log-time">[系统]</span>
                <span class="log-action">监控中心已启动</span>
            </div>
        </div>
    </div>
    
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h2>确认操作</h2>
            <p id="modalMessage">确定要结束这个进程吗？</p>
            <div class="modal-buttons">
                <button class="btn btn-danger" onclick="confirmAction()">确认</button>
                <button class="btn" onclick="closeModal()" style="background: #666;">取消</button>
            </div>
        </div>
    </div>
    
    <script>
        // 模拟数据生成器
        let processes = [];
        let cpuHistory = [];
        let maxHistory = 50;
        let sortField = 'cpu';
        let sortDirection = -1;
        let currentFilter = 'all';
        let pendingAction = null;
        
        // 生成模拟进程数据
        function generateMockProcesses() {
            const names = [
                'Trae CN', 'Trae CN', 'Trae CN', 'Trae CN', 'Trae CN', 'Trae CN', 'Trae CN', 'Trae CN',
                'explorer', 'svchost', 'chrome', 'firefox', 'code', 'node', 'python',
                'SearchUI', 'OneDrive', 'Teams', 'Discord', 'Spotify', 'Steam', 'EpicGames',
                'NahimicSvc32', 'AWCC', 'McAfee', 'ctfmon', 'ChsIME', 'sihost', 'dwm',
                'lsass', 'csrss', 'services', 'wininit', 'winlogon', 'smss', 'System',
                'backgroundTaskHost', 'powershell', 'cmd', 'conhost', 'dllhost', 'taskhostw'
            ];
            
            processes = [];
            for (let i = 0; i < 80 + Math.floor(Math.random() * 40); i++) {
                const name = names[Math.floor(Math.random() * names.length)];
                const isTrae = name === 'Trae CN';
                const baseCpu = isTrae ? (Math.random() * 40 + (Math.random() > 0.7 ? 20 : 0)) : Math.random() * 15;
                const baseMem = isTrae ? (50 + Math.random() * 350) : (10 + Math.random() * 100);
                
                processes.push({
                    pid: 1000 + Math.floor(Math.random() * 15000),
                    name: name,
                    cpu: baseCpu,
                    memory: Math.floor(baseMem),
                    threads: Math.floor(5 + Math.random() * 50),
                    priority: Math.random() > 0.8 ? 'AboveNormal' : (Math.random() > 0.9 ? 'Idle' : 'Normal'),
                    isSystem: ['svchost', 'lsass', 'csrss', 'services', 'wininit', 'winlogon', 'smss', 'System', 'dwm'].includes(name),
                    isTrae: isTrae
                });
            }
            
            // 确保有Trae进程
            if (!processes.some(p => p.isTrae)) {
                for (let i = 0; i < 12; i++) {
                    processes.push({
                        pid: 1000 + Math.floor(Math.random() * 15000),
                        name: 'Trae CN',
                        cpu: Math.random() * 30 + (i < 2 ? 20 : 0),
                        memory: 50 + Math.floor(Math.random() * 300),
                        threads: 10 + Math.floor(Math.random() * 50),
                        priority: 'Normal',
                        isSystem: false,
                        isTrae: true
                    });
                }
            }
            
            // 按CPU排序
            processes.sort((a, b) => b.cpu - a.cpu);
            
            // 去重PID
            const seen = new Set();
            processes = processes.filter(p => {
                if (seen.has(p.pid)) return false;
                seen.add(p.pid);
                return true;
            });
        }
        
        // 获取系统信息
        function getSystemInfo() {
            const cpu = 20 + Math.random() * 60 + (Math.random() > 0.7 ? 20 : 0);
            const mem = 40 + Math.random() * 30;
            
            return {
                cpu: Math.min(cpu, 100),
                memory: Math.min(mem, 100),
                memUsed: (8 * mem / 100).toFixed(1),
                memFree: (8 * (100 - mem) / 100).toFixed(1),
                memTotal: '8.0',
                processes: processes.length,
                threads: processes.reduce((sum, p) => sum + p.threads, 0),
                handles: 50000 + Math.floor(Math.random() * 50000),
                uptime: Math.floor(Math.random() * 72) + '小时 ' + Math.floor(Math.random() * 60) + '分钟'
            };
        }
        
        // 更新仪表盘
        function updateDashboard() {
            const info = getSystemInfo();
            
            // 更新统计
            document.getElementById('cpuValue').textContent = info.cpu.toFixed(1) + '%';
            document.getElementById('memValue').textContent = info.memory.toFixed(1) + '%';
            document.getElementById('procCount').textContent = info.processes;
            document.getElementById('threadCount').textContent = info.threads;
            
            // 更新仪表盘
            updateGauge('cpuGauge', 'cpuGaugeText', info.cpu);
            updateGauge('memGauge', 'memGaugeText', info.memory);
            
            // 更新内存详情
            document.getElementById('memUsed').textContent = info.memUsed + ' GB';
            document.getElementById('memFree').textContent = info.memFree + ' GB';
            document.getElementById('memTotal').textContent = info.memTotal + ' GB';
            
            // 更新系统信息
            document.getElementById('cpuName').textContent = 'Intel Core i5-10300H @ 2.50GHz';
            document.getElementById('cpuCores').textContent = '4核 8线程';
            document.getElementById('uptime').textContent = info.uptime;
            document.getElementById('handles').textContent = info.handles.toLocaleString();
            
            // 更新历史图表
            cpuHistory.push(info.cpu);
            if (cpuHistory.length > maxHistory) cpuHistory.shift();
            drawChart();
            
            // 检查高CPU警告
            checkAlerts(info.cpu);
            
            // 更新进程表
            renderProcessTable();
        }
        
        function updateGauge(gaugeId, textId, value) {
            const gauge = document.getElementById(gaugeId);
            const text = document.getElementById(textId);
            const max = 251;
            const offset = max - (max * value / 100);
            
            gauge.style.strokeDashoffset = offset;
            
            // 颜色根据值变化
            let color = '#00ff88';
            if (value > 50) color = '#ffaa00';
            if (value > 80) color = '#ff4444';
            gauge.style.stroke = color;
            
            text.textContent = value.toFixed(1) + '%';
            text.style.color = color;
        }
        
        function drawChart() {
            const canvas = document.getElementById('cpuChart');
            const ctx = canvas.getContext('2d');
            const width = canvas.width = canvas.offsetWidth;
            const height = canvas.height = 100;
            
            ctx.clearRect(0, 0, width, height);
            
            if (cpuHistory.length < 2) return;
            
            const max = 100;
            const step = width / (maxHistory - 1);
            
            // 绘制渐变填充
            ctx.beginPath();
            ctx.moveTo(0, height);
            
            for (let i = 0; i < cpuHistory.length; i++) {
                const x = i * step;
                const y = height - (cpuHistory[i] / max * height);
                ctx.lineTo(x, y);
            }
            
            ctx.lineTo((cpuHistory.length - 1) * step, height);
            ctx.closePath();
            
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, 'rgba(0, 212, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 212, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // 绘制线条
            ctx.beginPath();
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2;
            
            for (let i = 0; i < cpuHistory.length; i++) {
                const x = i * step;
                const y = height - (cpuHistory[i] / max * height);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            
            ctx.stroke();
        }
        
        function renderProcessTable() {
            const tbody = document.getElementById('processTableBody');
            let filtered = [...processes];
            
            // 应用筛选
            if (currentFilter === 'high') {
                filtered = filtered.filter(p => p.cpu > 20);
            } else if (currentFilter === 'trae') {
                filtered = filtered.filter(p => p.isTrae);
            } else if (currentFilter === 'system') {
                filtered = filtered.filter(p => p.isSystem);
            }
            
            // 应用搜索
            const search = document.getElementById('searchInput').value.toLowerCase();
            if (search) {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(search) || p.pid.toString().includes(search));
            }
            
            // 应用排序
            filtered.sort((a, b) => {
                let valA = a[sortField];
                let valB = b[sortField];
                if (typeof valA === 'string') {
                    return sortDirection * valA.localeCompare(valB);
                }
                return sortDirection * (valA - valB);
            });
            
            // 只显示前50个
            filtered = filtered.slice(0, 50);
            
            tbody.innerHTML = filtered.map(p => `
                <tr>
                    <td>${p.pid}</td>
                    <td>
                        <span style="color: ${p.isTrae ? '#00d4ff' : (p.isSystem ? '#ffaa00' : '#fff')}">
                            ${p.name}
                        </span>
                        ${p.isTrae ? '<span style="color: #888; font-size: 0.8em;">(Trae)</span>' : ''}
                    </td>
                    <td>
                        <div class="cpu-bar">
                            <div class="cpu-bar-fill ${p.cpu > 50 ? 'cpu-high' : (p.cpu > 20 ? 'cpu-medium' : 'cpu-low')}" 
                                 style="width: ${Math.min(p.cpu, 100)}%"></div>
                        </div>
                        ${p.cpu.toFixed(1)}%
                    </td>
                    <td>${p.memory} MB</td>
                    <td>${p.threads}</td>
                    <td>
                        <span style="color: ${p.priority === 'Idle' ? '#888' : (p.priority === 'AboveNormal' ? '#ffaa00' : '#fff')}">
                            ${p.priority}
                        </span>
                    </td>
                    <td>
                        ${!p.isSystem ? `
                            <button class="btn btn-warning" onclick="showConfirm('lower', ${p.pid}, '${p.name}')">降优先级</button>
                            <button class="btn btn-danger" onclick="showConfirm('kill', ${p.pid}, '${p.name}')">结束</button>
                        ` : '<span style="color: #666;">系统进程</span>'}
                    </td>
                </tr>
            `).join('');
        }
        
        function checkAlerts(cpu) {
            const alertBox = document.getElementById('alertBox');
            const traeCount = processes.filter(p => p.isTrae).length;
            const traeCpu = processes.filter(p => p.isTrae).reduce((sum, p) => sum + p.cpu, 0);
            
            if (cpu > 80 || traeCount > 12) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-danger';
                alertBox.innerHTML = `
                    <span style="font-size: 1.5em;">⚠️</span>
                    <div>
                        <strong>系统负载过高警告</strong><br>
                        CPU: ${cpu.toFixed(1)}% | Trae CN 进程: ${traeCount}个 (占用 ${traeCpu.toFixed(1)}% CPU)
                        <br><small>建议重启 Trae CN 或结束高占用进程</small>
                    </div>
                `;
            } else {
                alertBox.style.display = 'none';
            }
        }
        
        function sortTable(field) {
            if (sortField === field) {
                sortDirection *= -1;
            } else {
                sortField = field;
                sortDirection = -1;
            }
            renderProcessTable();
        }
        
        function filterProcesses() {
            renderProcessTable();
        }
        
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderProcessTable();
        }
        
        function showConfirm(action, pid, name) {
            pendingAction = { action, pid, name };
            const modal = document.getElementById('confirmModal');
            const msg = document.getElementById('modalMessage');
            
            if (action === 'kill') {
                msg.innerHTML = `确定要结束进程 <strong style="color: #ff4444;">${name} (PID: ${pid})</strong> 吗？<br><small>此操作不可撤销</small>`;
            } else {
                msg.innerHTML = `确定要降低进程 <strong>${name} (PID: ${pid})</strong> 的优先级吗？`;
            }
            
            modal.style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
            pendingAction = null;
        }
        
        function confirmAction() {
            if (!pendingAction) return;
            
            const { action, pid, name } = pendingAction;
            const proc = processes.find(p => p.pid === pid);
            
            if (action === 'kill') {
                processes = processes.filter(p => p.pid !== pid);
                addLog(`结束进程: ${name} (PID: ${pid})`, 'warning');
            } else {
                if (proc) {
                    proc.priority = 'Idle';
                    proc.cpu = Math.max(proc.cpu * 0.3, 1);
                    addLog(`降低优先级: ${name} (PID: ${pid})`, 'action');
                }
            }
            
            closeModal();
            renderProcessTable();
        }
        
        function optimizeSystem() {
            let optimized = 0;
            processes.forEach(p => {
                if (!p.isSystem && p.cpu > 20 && p.priority !== 'Idle') {
                    p.priority = 'BelowNormal';
                    p.cpu = Math.max(p.cpu * 0.5, 5);
                    optimized++;
                }
            });
            
            addLog(`系统优化完成: 已优化 ${optimized} 个进程`, 'action');
            renderProcessTable();
        }
        
        function refreshData() {
            generateMockProcesses();
            updateDashboard();
            addLog('数据已刷新', 'action');
        }
        
        function addLog(message, type = 'action') {
            const panel = document.getElementById('logPanel');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="log-${type}">${message}</span>
            `;
            panel.insertBefore(entry, panel.firstChild);
            
            // 只保留最近50条
            while (panel.children.length > 50) {
                panel.removeChild(panel.lastChild);
            }
        }
        
        function clearLog() {
            document.getElementById('logPanel').innerHTML = '';
            addLog('日志已清空', 'action');
        }
        
        // 初始化
        generateMockProcesses();
        updateDashboard();
        
        // 定时更新
        setInterval(() => {
            generateMockProcesses();
            updateDashboard();
        }, 3000);
        
        // 模拟实时波动
        setInterval(() => {
            processes.forEach(p => {
                p.cpu = Math.max(0, p.cpu + (Math.random() - 0.5) * 10);
            });
        }, 1000);
    </script>
</body>
</html>
